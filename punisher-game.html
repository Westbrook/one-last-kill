<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────────────────────
// THE PUNISHER — One Last Kill (Fan FPS)
// Single-file Three.js engine. All assets (textures, models, audio) are
// generated procedurally in-script. The only external resource is Three.js.
// Sections, top to bottom:
//   1. MATH/NOISE        — value noise, fBm, helpers
//   2. CANVAS TEXTURES   — procedural materials (plaster, brick, wood, etc.)
//   3. SKYBOX            — night sky + city glow cubemap
//   4. HUMANOID BUILDER  — parameterized box/capsule character constructor
//   5. AUDIO             — synthesized SFX bank via WebAudio
//   6. INPUT             — keyboard + mouse + pointer lock
//   7. HUD               — DOM overlay updater
//   8. COLLISION         — capsule vs AABB collider list
//   9. PLAYER CONTROLLER — gravity, walk/sprint/jump/crouch
//  10. WORLD             — test room (additional levels added by later tasks)
//  11. ENGINE            — renderer, scene, main loop
// ─────────────────────────────────────────────────────────────────────────────

// ─── ENGINE BOOTSTRAP ────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a14, 0.018);

const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.05, 600);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── 1. MATH / NOISE ─────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Value noise sampler with smoothstep interpolation across a wrapping N×N grid.
function makeValueNoise(seed, gridSize = 96) {
  const rng = mulberry32(seed);
  const N = gridSize;
  const g = new Float32Array(N * N);
  for (let i = 0; i < g.length; i++) g[i] = rng();
  return function sample(x, y) {
    x = ((x % N) + N) % N; y = ((y % N) + N) % N;
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const x1 = (xi + 1) % N, y1 = (yi + 1) % N;
    const a = g[yi * N + xi], b = g[yi * N + x1];
    const c = g[y1 * N + xi], d = g[y1 * N + x1];
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  };
}
function fBm(sample, x, y, octaves = 5, lac = 2.0, gain = 0.5) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * sample(x * freq, y * freq);
    norm += amp; amp *= gain; freq *= lac;
  }
  return sum / norm;
}

// ─── 2. CANVAS / TEXTURE HELPERS ─────────────────────────────────────────────
const TEX_SIZE = 512;
function makeCanvas(size = TEX_SIZE) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}
function makeRectCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}
function canvasToTexture(c, { repeat = 1, color = true } = {}) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = color ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.needsUpdate = true;
  return t;
}
// Sobel-style normal map derived from a grayscale "height" canvas.
function heightToNormalCanvas(heightCanvas, strength = 2.0) {
  const w = heightCanvas.width, h = heightCanvas.height;
  const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = makeCanvas(w);
  const dctx = out.getContext('2d');
  const img = dctx.createImageData(w, h);
  const data = img.data;
  const lum = (i) => src[i] / 255;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      const yu = (y - 1 + h) % h, yd = (y + 1) % h;
      const tl = lum((yu * w + xl) * 4), tr = lum((yu * w + xr) * 4);
      const bl = lum((yd * w + xl) * 4), br = lum((yd * w + xr) * 4);
      const l = lum((y * w + xl) * 4), r = lum((y * w + xr) * 4);
      const u = lum((yu * w + x) * 4), d = lum((yd * w + x) * 4);
      const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
      const dy = (bl + 2 * d + br) - (tl + 2 * u + tr);
      const nx = -dx * strength, ny = -dy * strength, nz = 1.0;
      const inv = 1 / Math.hypot(nx, ny, nz);
      const i = (y * w + x) * 4;
      data[i]     = ((nx * inv) * 0.5 + 0.5) * 255;
      data[i + 1] = ((ny * inv) * 0.5 + 0.5) * 255;
      data[i + 2] = ((nz * inv) * 0.5 + 0.5) * 255;
      data[i + 3] = 255;
    }
  }
  dctx.putImageData(img, 0, 0);
  return out;
}
function fillNoiseCanvas(canvas, sampleFn, { octaves = 5, scale = 8, contrast = 1, bias = 0 } = {}) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  const data = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const n = fBm(sampleFn, x / w * scale, y / h * scale, octaves);
      const v = clamp(((n - 0.5) * contrast + 0.5) + bias, 0, 1) * 255;
      const i = (y * w + x) * 4;
      data[i] = data[i + 1] = data[i + 2] = v; data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// ─── 3. PROCEDURAL TEXTURES & MATERIALS ──────────────────────────────────────
const MATS = {};
function defineMat(name, builder) {
  Object.defineProperty(MATS, name, {
    configurable: true,
    get() { const m = builder(); Object.defineProperty(MATS, name, { value: m, writable: false }); return m; },
  });
}

defineMat('plaster', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(1001);
  ctx.fillStyle = '#d8cdb8'; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(1011), { octaves: 6, scale: 12, contrast: 0.7 });
  ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 8; i++) {
    const x = rng() * c.width, y = rng() * c.height, r = 60 + rng() * 180;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(105,70,40,${0.18 + rng() * 0.2})`);
    g.addColorStop(1, 'rgba(105,70,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(40,28,18,0.6)';
  for (let i = 0; i < 14; i++) {
    let x = rng() * c.width, y = rng() * c.height;
    ctx.lineWidth = 0.6 + rng() * 0.8;
    ctx.beginPath(); ctx.moveTo(x, y);
    const segs = 6 + ((rng() * 8) | 0); let ang = rng() * TAU;
    for (let s = 0; s < segs; s++) { ang += (rng() - 0.5) * 1.4; x += Math.cos(ang) * 10; y += Math.sin(ang) * 10; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  const hc = makeCanvas(); fillNoiseCanvas(hc, makeValueNoise(1012), { octaves: 5, scale: 14, contrast: 1.4 });
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 2 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 1.2), { repeat: 2, color: false }),
    roughness: 0.92, metalness: 0.02,
  });
});

defineMat('wallpaper', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(2001);
  const stripeA = '#7a3a2a', stripeB = '#a86040';
  for (let x = 0; x < c.width; x += 24) {
    ctx.fillStyle = ((x / 24) | 0) % 2 === 0 ? stripeA : stripeB;
    ctx.fillRect(x, 0, 24, c.height);
  }
  for (let y = 16; y < c.height; y += 40) {
    const off = ((y / 40) | 0) % 2 ? 24 : 0;
    for (let x = 12; x < c.width; x += 48) {
      ctx.fillStyle = 'rgba(255,210,160,0.55)';
      ctx.beginPath(); ctx.arc(x + off, y, 3.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(60,30,20,0.6)'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.arc(x + off, y, 6, 0, TAU); ctx.stroke();
    }
  }
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(2002), { octaves: 5, scale: 10, contrast: 0.6 });
  ctx.globalAlpha = 0.45; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  return new THREE.MeshStandardMaterial({ map: canvasToTexture(c, { repeat: 2 }), roughness: 0.85, metalness: 0.0 });
});

defineMat('brick', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(3001);
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0, 0, c.width, c.height);
  const bw = 64, bh = 24;
  for (let y = 0; y < c.height; y += bh) {
    const offset = ((y / bh) & 1) ? bw / 2 : 0;
    for (let x = -bw; x < c.width; x += bw) {
      const bx = x + offset + 2, by = y + 2, w = bw - 4, h = bh - 4;
      const r = 110 + ((rng() * 60) | 0), g = 50 + ((rng() * 30) | 0), b = 35 + ((rng() * 20) | 0);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      for (let s = 0; s < 6; s++) ctx.fillRect((bx + rng() * w) | 0, (by + rng() * h) | 0, 1, 1);
    }
  }
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(3002), { octaves: 5, scale: 8, contrast: 0.7 });
  ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const hc = makeCanvas(); const hctx = hc.getContext('2d');
  hctx.fillStyle = '#000'; hctx.fillRect(0, 0, hc.width, hc.height);
  for (let y = 0; y < hc.height; y += bh) {
    const offset = ((y / bh) & 1) ? bw / 2 : 0;
    hctx.fillStyle = '#fff';
    for (let x = -bw; x < hc.width; x += bw) hctx.fillRect(x + offset + 2, y + 2, bw - 4, bh - 4);
  }
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 2 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 3.0), { repeat: 2, color: false }),
    roughness: 0.95, metalness: 0.0,
  });
});

defineMat('concrete', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(4001);
  ctx.fillStyle = '#6f7174'; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(4002), { octaves: 6, scale: 14, contrast: 0.6 });
  ctx.globalAlpha = 0.6; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 10; i++) {
    const x = rng() * c.width, y = rng() * c.height, r = 30 + rng() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(20,18,16,${0.15 + rng() * 0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  const hc = makeCanvas(); fillNoiseCanvas(hc, makeValueNoise(4003), { octaves: 5, scale: 18, contrast: 1.2 });
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 3 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 1.0), { repeat: 3, color: false }),
    roughness: 0.93, metalness: 0.02,
  });
});

defineMat('wood', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(5001);
  ctx.fillStyle = '#3b2415'; ctx.fillRect(0, 0, c.width, c.height);
  const plankH = 48;
  for (let y = 0; y < c.height; y += plankH) {
    const r = 70 + ((rng() * 40) | 0), g = 40 + ((rng() * 22) | 0), b = 20 + ((rng() * 15) | 0);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y + 1, c.width, plankH - 2);
    ctx.strokeStyle = `rgba(${Math.max(0, r - 40)},${Math.max(0, g - 25)},${Math.max(0, b - 15)},0.55)`;
    for (let i = 0; i < 14; i++) {
      ctx.lineWidth = 0.6 + rng() * 0.7;
      ctx.beginPath();
      const yy = y + 4 + (rng() * (plankH - 8));
      ctx.moveTo(0, yy);
      let cy = yy;
      for (let x = 0; x < c.width; x += 16) { cy += (rng() - 0.5) * 1.6; ctx.lineTo(x, cy); }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, y, c.width, 1.5);
  }
  const hc = makeCanvas(); const hctx = hc.getContext('2d');
  hctx.fillStyle = '#fff'; hctx.fillRect(0, 0, hc.width, hc.height);
  hctx.fillStyle = '#000';
  for (let y = 0; y < hc.height; y += plankH) hctx.fillRect(0, y, hc.width, 2);
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 2 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 1.5), { repeat: 2, color: false }),
    roughness: 0.78, metalness: 0.0,
  });
});

defineMat('metal', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(6001);
  ctx.fillStyle = '#4a4d52'; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(6002), { octaves: 5, scale: 6, contrast: 0.5 });
  ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 18; i++) {
    const x = rng() * c.width, y = rng() * c.height, r = 8 + rng() * 40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(150,70,30,${0.3 + rng() * 0.3})`);
    g.addColorStop(1, 'rgba(150,70,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(220,220,225,0.35)';
  for (let i = 0; i < 30; i++) {
    ctx.lineWidth = 0.4 + rng() * 0.6;
    const x1 = rng() * c.width, y1 = rng() * c.height;
    const a = rng() * TAU, len = 30 + rng() * 120;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + Math.cos(a) * len, y1 + Math.sin(a) * len); ctx.stroke();
  }
  const hc = makeCanvas(); fillNoiseCanvas(hc, makeValueNoise(6003), { octaves: 4, scale: 6, contrast: 0.8 });
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 2 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 0.6), { repeat: 2, color: false }),
    roughness: 0.55, metalness: 0.75,
  });
});

defineMat('asphalt', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  const rng = mulberry32(7001);
  ctx.fillStyle = '#1a1a1c'; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(7002), { octaves: 6, scale: 20, contrast: 0.7 });
  ctx.globalAlpha = 0.6; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 600; i++) {
    const v = (60 + rng() * 60) | 0;
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect((rng() * c.width) | 0, (rng() * c.height) | 0, 1, 1);
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  for (let i = 0; i < 8; i++) {
    let x = rng() * c.width, y = rng() * c.height;
    ctx.lineWidth = 0.6 + rng();
    ctx.beginPath(); ctx.moveTo(x, y);
    let ang = rng() * TAU;
    const segs = 10 + ((rng() * 10) | 0);
    for (let s = 0; s < segs; s++) { ang += (rng() - 0.5) * 1.2; x += Math.cos(ang) * 12; y += Math.sin(ang) * 12; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  const hc = makeCanvas(); fillNoiseCanvas(hc, makeValueNoise(7003), { octaves: 5, scale: 18 });
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 4 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 0.6), { repeat: 4, color: false }),
    roughness: 0.95, metalness: 0.0,
  });
});

defineMat('tar', () => {
  const c = makeCanvas(); const ctx = c.getContext('2d');
  ctx.fillStyle = '#15140f'; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(); fillNoiseCanvas(noise, makeValueNoise(8001), { octaves: 6, scale: 14, contrast: 0.6 });
  ctx.globalAlpha = 0.4; ctx.globalCompositeOperation = 'screen'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#2b1f12';
  for (let y = 0; y < c.height; y += 64) ctx.fillRect(0, y, c.width, 3);
  for (let x = 0; x < c.width; x += 96) ctx.fillRect(x, 0, 3, c.height);
  const hc = makeCanvas(); const hctx = hc.getContext('2d');
  hctx.fillStyle = '#000'; hctx.fillRect(0, 0, hc.width, hc.height);
  hctx.fillStyle = '#aaa';
  for (let y = 0; y < hc.height; y += 64) hctx.fillRect(0, y, hc.width, 4);
  for (let x = 0; x < hc.width; x += 96) hctx.fillRect(x, 0, 4, hc.height);
  return new THREE.MeshStandardMaterial({
    map: canvasToTexture(c, { repeat: 3 }),
    normalMap: canvasToTexture(heightToNormalCanvas(hc, 1.6), { repeat: 3, color: false }),
    roughness: 0.9, metalness: 0.0,
  });
});

// Night-sky equirectangular skybox with city silhouette + amber glow.
function buildSkybox() {
  const w = 2048, h = 1024;
  const c = makeRectCanvas(w, h); const ctx = c.getContext('2d');
  const rng = mulberry32(9999);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#020410'); g.addColorStop(0.55, '#160c20');
  g.addColorStop(0.78, '#3a1408'); g.addColorStop(1, '#0a0604');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    const x = rng() * w, y = rng() * h * 0.62;
    const r = rng() * 1.6 + 0.2;
    ctx.fillStyle = `rgba(255,255,${(200 + rng() * 55) | 0},${0.3 + rng() * 0.7})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  const horizon = h * 0.78;
  ctx.fillStyle = '#000';
  let x = 0;
  while (x < w) {
    const bw = 28 + rng() * 80;
    const bh = 40 + rng() * 220;
    ctx.fillStyle = '#000'; ctx.fillRect(x, horizon - bh, bw, bh + 30);
    for (let wy = horizon - bh + 8; wy < horizon - 4; wy += 10) {
      for (let wx = x + 4; wx < x + bw - 4; wx += 8) {
        if (rng() > 0.55) {
          ctx.fillStyle = rng() > 0.5 ? '#ffd680' : '#fff2b0';
          ctx.fillRect(wx, wy, 3, 4);
        }
      }
    }
    x += bw + 1;
  }
  const og = ctx.createLinearGradient(0, horizon - 140, 0, horizon + 30);
  og.addColorStop(0, 'rgba(255,120,40,0)');
  og.addColorStop(1, 'rgba(255,120,40,0.55)');
  ctx.fillStyle = og; ctx.fillRect(0, horizon - 140, w, 170);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function makeFaceTexture(skinHex = '#caa590', seed = 100) {
  const c = makeCanvas(128); const ctx = c.getContext('2d');
  const rng = mulberry32(seed);
  ctx.fillStyle = skinHex; ctx.fillRect(0, 0, c.width, c.height);
  const g = ctx.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(38, 54, 16, 11); ctx.fillRect(74, 54, 16, 11);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(44 + ((rng() * 2) | 0), 58, 4, 5);
  ctx.fillRect(80 + ((rng() * 2) | 0), 58, 4, 5);
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(36, 48, 20, 3); ctx.fillRect(72, 48, 20, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(62, 64, 4, 10); ctx.fillRect(58, 72, 12, 2);
  ctx.fillStyle = '#41201a';
  ctx.fillRect(48, 86, 32, 3);
  ctx.fillStyle = 'rgba(40,30,25,0.4)';
  for (let i = 0; i < 240; i++) ctx.fillRect((rng() * c.width) | 0, 80 + ((rng() * 42) | 0), 1, 1);
  return canvasToTexture(c, { repeat: 1 });
}
function makeClothTexture(baseHex, accentHex, seed = 200) {
  const c = makeCanvas(128); const ctx = c.getContext('2d');
  ctx.fillStyle = baseHex; ctx.fillRect(0, 0, c.width, c.height);
  const noise = makeCanvas(128); fillNoiseCanvas(noise, makeValueNoise(seed, 64), { octaves: 5, scale: 8, contrast: 0.4 });
  ctx.globalAlpha = 0.55; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(noise, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = accentHex;
  ctx.fillRect(0, (c.height / 2) - 4, c.width, 8);
  return canvasToTexture(c, { repeat: 1 });
}

function makeHumanoid(opts = {}) {
  const o = Object.assign({
    skin: '#caa590', shirt: '#3a3a44', shirtAccent: '#1a1a1f',
    pants: '#1d1d24', hair: '#1c1410', height: 1.78, build: 1.0,
    seed: 1, kind: 'adult',
  }, opts);

  const faceTex  = makeFaceTexture(o.skin, o.seed);
  const shirtTex = makeClothTexture(o.shirt, o.shirtAccent, o.seed + 1);
  const pantsTex = makeClothTexture(o.pants, o.pants, o.seed + 2);

  const skinMat  = new THREE.MeshStandardMaterial({ color: o.skin, roughness: 0.7, metalness: 0.02 });
  const faceMat  = new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.6, metalness: 0.02 });
  const shirtMat = new THREE.MeshStandardMaterial({ map: shirtTex, roughness: 0.85, metalness: 0.0 });
  const pantsMat = new THREE.MeshStandardMaterial({ map: pantsTex, roughness: 0.85, metalness: 0.0 });
  const hairMat  = new THREE.MeshStandardMaterial({ color: o.hair, roughness: 0.85, metalness: 0.0 });

  const s = o.build;
  const torsoW = 0.46 * s, torsoH = 0.62, torsoD = 0.26 * s;
  const headW = 0.22, headH = 0.27, headD = 0.22;
  const legH = 0.86, legW = 0.16 * s, legD = 0.18 * s;
  const armH = 0.66, armW = 0.12 * s, armD = 0.13 * s;
  const totalUnscaled = legH + torsoH + headH + 0.04;
  const scale = o.height / totalUnscaled;

  const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  const headMats = [skinMat, skinMat, hairMat, skinMat, faceMat, hairMat];

  const group = new THREE.Group(); group.name = `humanoid:${o.kind}`;
  const legL = box(legW, legH, legD, pantsMat); legL.position.set(-legW * 0.55, legH / 2, 0); legL.name = 'leg.l';
  const legR = box(legW, legH, legD, pantsMat); legR.position.set( legW * 0.55, legH / 2, 0); legR.name = 'leg.r';
  const torso = box(torsoW, torsoH, torsoD, shirtMat); torso.position.y = legH + torsoH / 2;
  const head = box(headW, headH, headD, headMats); head.position.y = legH + torsoH + headH / 2 + 0.02;
  const armL = box(armW, armH, armD, shirtMat); armL.position.set(-(torsoW / 2 + armW / 2 + 0.01), legH + torsoH - armH / 2, 0); armL.name = 'arm.l';
  const armR = box(armW, armH, armD, shirtMat); armR.position.set( (torsoW / 2 + armW / 2 + 0.01), legH + torsoH - armH / 2, 0); armR.name = 'arm.r';
  for (const m of [legL, legR, torso, head, armL, armR]) { m.castShadow = true; m.receiveShadow = true; group.add(m); }
  group.scale.setScalar(scale);
  group.userData = { config: o, parts: { legL, legR, torso, head, armL, armR } };
  return group;
}

// ─── 5. AUDIO (procedural SFX via WebAudio) ──────────────────────────────────
const Audio = (() => {
  let ctx = null, master = null;
  let ambient = null, fire = null;
  function ensure() {
    if (ctx) return;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    ctx = new Ctor();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
  }
  function resume() { ensure(); if (ctx.state === 'suspended') ctx.resume(); }
  function noiseBuffer(seconds = 1) {
    ensure();
    const len = (seconds * ctx.sampleRate) | 0;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function gunshot() {
    ensure();
    const now = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.22);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0, now);
    g.gain.linearRampToValueAtTime(1.0, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    src.connect(bp).connect(g).connect(master);
    src.start(now); src.stop(now + 0.25);
    const o = ctx.createOscillator(); o.type = 'sine';
    const og = ctx.createGain();
    o.frequency.setValueAtTime(120, now);
    o.frequency.exponentialRampToValueAtTime(40, now + 0.15);
    og.gain.setValueAtTime(0.7, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    o.connect(og).connect(master); o.start(now); o.stop(now + 0.2);
  }
  function meleeHit() {
    ensure();
    const now = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.12);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.9, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    src.connect(lp).connect(g).connect(master); src.start(now); src.stop(now + 0.14);
    const o = ctx.createOscillator(); o.type = 'square';
    const og = ctx.createGain();
    o.frequency.setValueAtTime(200, now);
    o.frequency.exponentialRampToValueAtTime(70, now + 0.1);
    og.gain.setValueAtTime(0.25, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    o.connect(og).connect(master); o.start(now); o.stop(now + 0.14);
  }
  function footstep() {
    ensure();
    const now = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.08);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400 + Math.random() * 200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    src.connect(lp).connect(g).connect(master); src.start(now); src.stop(now + 0.09);
  }
  function startAmbient() {
    ensure(); if (ambient) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(4); src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280;
    const g = ctx.createGain(); g.gain.value = 0.07;
    src.connect(lp).connect(g).connect(master); src.start();
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 55;
    const og = ctx.createGain(); og.gain.value = 0.03;
    o.connect(og).connect(master); o.start();
    ambient = { src, o };
  }
  function startFireCrackle() {
    ensure(); if (fire) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(3); src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    const g = ctx.createGain(); g.gain.value = 0.06;
    src.connect(hp).connect(g).connect(master); src.start();
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 4 + Math.random() * 4;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.04;
    lfo.connect(lfoGain).connect(g.gain); lfo.start();
    fire = { src, lfo };
  }
  function stopFireCrackle() {
    if (!fire) return;
    try { fire.src.stop(); fire.lfo.stop(); } catch (_) { /* already stopped */ }
    fire = null;
  }
  return { resume, gunshot, meleeHit, footstep, startAmbient, startFireCrackle, stopFireCrackle };
})();

// ─── 6. INPUT (keyboard + mouse + pointer lock) ──────────────────────────────
const Input = {
  keys: new Set(),
  mouseDX: 0, mouseDY: 0,
  leftDown: false, leftPressed: false,
  ePressed: false, rPressed: false,
  locked: false,
  consumeFrame() {
    const r = { dx: this.mouseDX, dy: this.mouseDY, leftPressed: this.leftPressed, ePressed: this.ePressed, rPressed: this.rPressed };
    this.mouseDX = 0; this.mouseDY = 0;
    this.leftPressed = false; this.ePressed = false; this.rPressed = false;
    return r;
  },
};
addEventListener('keydown', (e) => {
  Input.keys.add(e.code);
  if (e.code === 'KeyE') Input.ePressed = true;
  if (e.code === 'KeyR') Input.rPressed = true;
  if (e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', (e) => { Input.keys.delete(e.code); });
addEventListener('mousedown', (e) => { if (e.button === 0) { Input.leftDown = true; Input.leftPressed = true; } });
addEventListener('mouseup',   (e) => { if (e.button === 0) { Input.leftDown = false; } });
addEventListener('mousemove', (e) => { if (Input.locked) { Input.mouseDX += e.movementX; Input.mouseDY += e.movementY; } });

// ─── 8. COLLISION (capsule vs AABB list) ─────────────────────────────────────
const Colliders = {
  list: [],
  addBox(min, max) {
    const b = new THREE.Box3(min.clone(), max.clone());
    this.list.push(b); return b;
  },
  addFromMesh(mesh, pad = 0) {
    mesh.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(mesh);
    if (pad) { box.expandByScalar(pad); }
    this.list.push(box); return box;
  },
  addBoxBySize(cx, cy, cz, sx, sy, sz) {
    return this.addBox(
      new THREE.Vector3(cx - sx / 2, cy - sy / 2, cz - sz / 2),
      new THREE.Vector3(cx + sx / 2, cy + sy / 2, cz + sz / 2),
    );
  },
  clear() { this.list.length = 0; },
};
function resolveSphereAABB(center, radius, box) {
  const closest = new THREE.Vector3(
    clamp(center.x, box.min.x, box.max.x),
    clamp(center.y, box.min.y, box.max.y),
    clamp(center.z, box.min.z, box.max.z),
  );
  const diff = center.clone().sub(closest);
  const dist2 = diff.lengthSq();
  if (dist2 >= radius * radius) return null;
  if (dist2 < 1e-8) {
    const cx = (box.min.x + box.max.x) / 2;
    const cy = (box.min.y + box.max.y) / 2;
    const cz = (box.min.z + box.max.z) / 2;
    const ext = new THREE.Vector3(
      Math.min(center.x - box.min.x, box.max.x - center.x),
      Math.min(center.y - box.min.y, box.max.y - center.y),
      Math.min(center.z - box.min.z, box.max.z - center.z),
    );
    const minA = Math.min(ext.x, ext.y, ext.z);
    let n;
    if (minA === ext.x)      n = new THREE.Vector3(center.x < cx ? -1 : 1, 0, 0);
    else if (minA === ext.y) n = new THREE.Vector3(0, center.y < cy ? -1 : 1, 0);
    else                     n = new THREE.Vector3(0, 0, center.z < cz ? -1 : 1);
    return { normal: n, depth: radius + minA };
  }
  const d = Math.sqrt(dist2);
  return { normal: diff.divideScalar(d), depth: radius - d };
}

// ─── 9. PLAYER CONTROLLER ────────────────────────────────────────────────────
const Player = {
  pos: new THREE.Vector3(0, 1.72, 4),
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  eyeHeight: 1.72, crouchEye: 1.10,
  bodyHeight: 1.84, crouchBody: 1.22,
  radius: 0.32,
  isCrouching: false, onGround: false,
  speedWalk: 4.2, speedSprint: 7.0, jumpVel: 5.6,
  health: 100,
  footTimer: 0,
  attackCooldown: 0,
  _eyeH: 1.72, _bodyH: 1.84,
};
function playerInit() {
  camera.position.copy(Player.pos);
  HUD.setHealth(Player.health);
}
function playerUpdate(dt) {
  const inp = Input.consumeFrame();
  if (Input.locked) {
    Player.yaw   -= inp.dx * 0.0025;
    Player.pitch -= inp.dy * 0.0025;
    Player.pitch = clamp(Player.pitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
  }

  const forward = new THREE.Vector3(-Math.sin(Player.yaw), 0, -Math.cos(Player.yaw));
  const right   = new THREE.Vector3( Math.cos(Player.yaw), 0, -Math.sin(Player.yaw));

  const wantsCrouch = Input.keys.has('KeyC') || Input.keys.has('ControlLeft');
  Player.isCrouching = wantsCrouch;
  const targetEye  = wantsCrouch ? Player.crouchEye  : Player.eyeHeight;
  const targetBody = wantsCrouch ? Player.crouchBody : Player.bodyHeight;
  const blend = Math.min(1, dt * 10);
  Player._eyeH  = lerp(Player._eyeH,  targetEye,  blend);
  Player._bodyH = lerp(Player._bodyH, targetBody, blend);

  const mv = new THREE.Vector3();
  if (Input.keys.has('KeyW')) mv.add(forward);
  if (Input.keys.has('KeyS')) mv.sub(forward);
  if (Input.keys.has('KeyD')) mv.add(right);
  if (Input.keys.has('KeyA')) mv.sub(right);
  if (mv.lengthSq() > 0) mv.normalize();
  const sprint = Input.keys.has('ShiftLeft') && !wantsCrouch && mv.lengthSq() > 0;
  let speed = sprint ? Player.speedSprint : Player.speedWalk;
  if (wantsCrouch) speed *= 0.5;

  const targetVx = mv.x * speed, targetVz = mv.z * speed;
  const accel = Player.onGround ? 18 : 4;
  Player.vel.x += (targetVx - Player.vel.x) * Math.min(1, dt * accel);
  Player.vel.z += (targetVz - Player.vel.z) * Math.min(1, dt * accel);

  Player.vel.y -= 22 * dt;
  if (Player.onGround && Input.keys.has('Space')) {
    Player.vel.y = Player.jumpVel; Player.onGround = false;
  }

  Player.pos.addScaledVector(Player.vel, dt);

  const r = Player.radius;
  const bodyH = Player._bodyH;
  Player.onGround = false;
  for (let pass = 0; pass < 4; pass++) {
    const footY = Player.pos.y - Player._eyeH;
    const sphereBottom = new THREE.Vector3(Player.pos.x, footY + r, Player.pos.z);
    const sphereTop    = new THREE.Vector3(Player.pos.x, footY + bodyH - r, Player.pos.z);
    let moved = false;
    for (const box of Colliders.list) {
      for (const sph of [sphereBottom, sphereTop]) {
        const hit = resolveSphereAABB(sph, r, box);
        if (hit) {
          Player.pos.addScaledVector(hit.normal, hit.depth);
          sph.addScaledVector(hit.normal, hit.depth);
          const vn = Player.vel.dot(hit.normal);
          if (vn < 0) Player.vel.addScaledVector(hit.normal, -vn);
          if (hit.normal.y > 0.5) Player.onGround = true;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  if (Player.pos.y - Player._eyeH < 0) {
    Player.pos.y = Player._eyeH;
    if (Player.vel.y < 0) Player.vel.y = 0;
    Player.onGround = true;
  }

  camera.position.copy(Player.pos);
  camera.rotation.set(Player.pitch, Player.yaw, 0, 'YXZ');

  const horizSpeed = Math.hypot(Player.vel.x, Player.vel.z);
  if (Player.onGround && horizSpeed > 1.5) {
    Player.footTimer -= dt;
    if (Player.footTimer <= 0) { Audio.footstep(); Player.footTimer = sprint ? 0.32 : 0.45; }
  } else {
    Player.footTimer = 0;
  }

  Player.attackCooldown = Math.max(0, Player.attackCooldown - dt);
  if (inp.leftPressed && Input.locked && Player.attackCooldown <= 0) {
    Audio.meleeHit();
    Player.attackCooldown = 0.35;
  }
}

// ─── 10. WORLD: TEST ROOM ────────────────────────────────────────────────────
const World = new THREE.Group(); World.name = 'world';
scene.add(World);

function addLights() {
  const ambient = new THREE.AmbientLight(0x29304a, 0.55);
  scene.add(ambient);

  const moon = new THREE.DirectionalLight(0xa8c4ff, 0.55);
  moon.position.set(-12, 22, -6);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -22; moon.shadow.camera.right = 22;
  moon.shadow.camera.top = 22;  moon.shadow.camera.bottom = -22;
  moon.shadow.camera.near = 0.5; moon.shadow.camera.far = 80;
  moon.shadow.bias = -0.0005;
  scene.add(moon);

  const bulb = new THREE.PointLight(0xffcc88, 2.4, 16, 1.6);
  bulb.position.set(0, 3.05, 0);
  bulb.castShadow = true;
  bulb.shadow.mapSize.set(1024, 1024);
  bulb.shadow.bias = -0.0005;
  scene.add(bulb);

  const bulbMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffe2a8, emissive: 0xffaa55, emissiveIntensity: 3.0 }),
  );
  bulbMesh.position.copy(bulb.position);
  scene.add(bulbMesh);
  const cordMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 });
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.35, 6), cordMat);
  cord.position.set(0, 3.22, 0); scene.add(cord);
}

function buildTestRoom() {
  const W = 12, D = 12, H = 3.4;

  const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), MATS.wood);
  floor.position.set(0, -0.1, 0); floor.receiveShadow = true; World.add(floor);
  Colliders.addBoxBySize(0, -0.1, 0, W, 0.2, D);

  const ceil = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), MATS.plaster);
  ceil.position.set(0, H + 0.1, 0); ceil.receiveShadow = true; World.add(ceil);
  Colliders.addBoxBySize(0, H + 0.1, 0, W, 0.2, D);

  const wallMat = MATS.wallpaper;
  const wallN = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.2), wallMat);
  wallN.position.set(0, H / 2, -D / 2); wallN.castShadow = true; wallN.receiveShadow = true; World.add(wallN);
  Colliders.addBoxBySize(0, H / 2, -D / 2, W, H, 0.2);

  const wallS = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.2), wallMat);
  wallS.position.set(0, H / 2, D / 2); wallS.castShadow = true; wallS.receiveShadow = true; World.add(wallS);
  Colliders.addBoxBySize(0, H / 2, D / 2, W, H, 0.2);

  const wallE = new THREE.Mesh(new THREE.BoxGeometry(0.2, H, D), MATS.brick);
  wallE.position.set(W / 2, H / 2, 0); wallE.castShadow = true; wallE.receiveShadow = true; World.add(wallE);
  Colliders.addBoxBySize(W / 2, H / 2, 0, 0.2, H, D);

  const wallW = new THREE.Mesh(new THREE.BoxGeometry(0.2, H, D), wallMat);
  wallW.position.set(-W / 2, H / 2, 0); wallW.castShadow = true; wallW.receiveShadow = true; World.add(wallW);
  Colliders.addBoxBySize(-W / 2, H / 2, 0, 0.2, H, D);

  // A pair of concrete crates to prove collision + climbing
  const crate1 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 1.4), MATS.concrete);
  crate1.position.set(-3.2, 0.5, -2.5); crate1.castShadow = true; crate1.receiveShadow = true; World.add(crate1);
  Colliders.addFromMesh(crate1);

  const crate2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 1.0), MATS.concrete);
  crate2.position.set(-2.2, 0.35, -3.5); crate2.castShadow = true; crate2.receiveShadow = true; World.add(crate2);
  Colliders.addFromMesh(crate2);

  // A metal table on the right
  const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.9), MATS.metal);
  tableTop.position.set(3.0, 0.92, 1.8); tableTop.castShadow = true; tableTop.receiveShadow = true; World.add(tableTop);
  Colliders.addFromMesh(tableTop);
  const legMat = MATS.metal;
  const legGeo = new THREE.BoxGeometry(0.08, 0.9, 0.08);
  for (const [lx, lz] of [[-0.7, -0.4], [0.7, -0.4], [-0.7, 0.4], [0.7, 0.4]]) {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(3.0 + lx, 0.45, 1.8 + lz); leg.castShadow = true; leg.receiveShadow = true; World.add(leg);
  }

  // Roof-tar accent slab as a visual reference
  const slab = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.12, 2.4), MATS.tar);
  slab.position.set(3.2, 0.06, -3.0); slab.receiveShadow = true; World.add(slab);
  Colliders.addFromMesh(slab);

  // Asphalt pad just outside the doorway opening on the south wall
  const pad = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.05, 1.6), MATS.asphalt);
  pad.position.set(0, 0.025, D / 2 - 0.9); pad.receiveShadow = true; World.add(pad);

  // A glass pane standing free on the table
  const pane = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.02), MATS.glass);
  pane.position.set(3.0, 1.25, 1.8); pane.castShadow = false; pane.receiveShadow = false; World.add(pane);

  // A humanoid mannequin proving the model builder works
  const mannequin = makeHumanoid(HUMANOID_PRESETS.thug);
  mannequin.position.set(2.0, 0, -3.0);
  mannequin.rotation.y = Math.PI * 0.85;
  World.add(mannequin);

  const civilian = makeHumanoid(HUMANOID_PRESETS.shopkeeper);
  civilian.position.set(-3.0, 0, 2.0);
  civilian.rotation.y = -Math.PI * 0.25;
  World.add(civilian);

  const child = makeHumanoid(HUMANOID_PRESETS.child);
  child.position.set(-4.2, 0, 2.6);
  child.rotation.y = -Math.PI * 0.1;
  World.add(child);
}

// ─── 11. ENGINE / MAIN ───────────────────────────────────────────────────────
scene.background = buildSkybox();
addLights();
buildTestRoom();
playerInit();
HUD.setObjective('TEST ROOM · CLICK TO PLAY');
HUD.setWeapon('UNARMED', '— / —');

const clock = new THREE.Clock();
let acc = 0;
const STEP = 1 / 120;

function frame() {
  let dt = clock.getDelta();
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= STEP) { playerUpdate(STEP); acc -= STEP; }
  HUD.update(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
</script>
